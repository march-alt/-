function parseBooks(csv){let topic='',header=null;const parsed=[];for(let line of csv.split('\n')){if(line.endsWith('\r'))line=line.slice(0,-1);if(line.charCodeAt(0)===0xFEFF)line=line.slice(1);if(!line.trim())continue;if(line.trim().startsWith('【')){topic=line.trim();header=null;continue}const row=splitCsvLine(line);if(row.some(v=>v.trim()==='書名')&&row.some(v=>v.trim()==='著者名')){header=row.map(v=>v.trim());continue}if(!header)continue;const get=name=>row[header.indexOf(name)]||'';const title=get('書名').trim(),author=get('著者名').trim();if(!title||!author)continue;let genre='',moods=[],formats=[];if(topic.includes('ｐｃ')||topic.toLowerCase().includes('pc')){genre='IT技術・PC関係';moods.push('学びたい')}if(topic.includes('趣味'))genre='趣味・実用';if(topic.includes('暮らし'))genre='暮らし・健康・子育て';if(topic.includes('ベストセラー'))genre='ベストセラー';if(topic.includes('警察'))genre='警察小説';else if(topic.includes('ミステリー'))genre='ミステリー';if(topic.includes('元気'))moods.push('元気が欲しい');if(topic.includes('泣ける'))moods.push('泣ける');if(topic.includes('笑える'))moods.push('くすっと笑える');if(topic.includes('短く'))moods.push('短く読める');if(topic.includes('物語'))moods.push('物語に浸りたい');if(topic.includes('がっつり'))formats.push('がっつり読める');if(topic.includes('短く'))formats.push('サクッと読める');const publisher=get('出版社').trim(),note=get('備考（シリーズ・巻数情報）').trim();parsed.push({title,author,genre,moods,formats,keywords:'',desc:[publisher,note].filter(Boolean).join(' ・ ')||'CSVから読み込んだおすすめ本です。',color:'c'+(parsed.length%6+1)})}const map=new Map();for(const b of parsed){const k=norm(b.title)+'|'+norm(b.author);if(map.has(k)){const old=map.get(k);old.moods=[...new Set([...old.moods,...b.moods])];old.formats=[...new Set([...old.formats,...b.formats])];if(!old.genre)old.genre=b.genre}else map.set(k,b)}return [...map.values()]}
const sourceBooks=parseBooks(decodeCsv(embeddedCsvB64));let books=[...curatedBooks,...pcReplacementBooks,...trendingBooks];for(const b of sourceBooks){if(b.genre==='IT技術・PC関係')continue;const existing=books.find(x=>norm(x.title)===norm(b.title)&&norm(x.author)===norm(b.author));if(existing){existing.moods=[...new Set([...existing.moods,...b.moods])];existing.formats=[...new Set([...existing.formats,...b.formats])];if(!existing.desc||existing.desc==='')existing.desc=b.desc}else books.push(b)}
document.getElementById('finder').addEventListener('submit',e=>{e.preventDefault();const genre=document.getElementById('genre').value,mood=document.getElementById('mood').value,format=document.getElementById('format').value,favRaw=document.getElementById('favorite').value.trim(),terms=favRaw.split(/[、,，\n]+/).map(norm).filter(Boolean);let scored=books.map((b,i)=>{const title=norm(b.title),author=norm(b.author);const favoriteMatch=!terms.length||terms.some(term=>title.includes(term)||author.includes(term));const genreMatch=!genre||b.genre===genre,moodMatch=!mood||!b.moods.length||b.moods.includes(mood),formatMatch=!format||!b.formats.length||b.formats.includes(format);let score=(genre&&b.genre===genre?5:0)+(mood&&b.moods.includes(mood)?4:0)+(format&&b.formats.includes(format)?3:0);if(terms.length&&favoriteMatch)score+=7;return{b,i,score,ok:favoriteMatch&&genreMatch&&moodMatch&&formatMatch}}).filter(x=>x.ok);if(!genre&&!mood&&!format&&!terms.length)scored=books.slice(0,6).map((b,i)=>({b,i,score:0}));scored.sort((a,b)=>b.score-a.score);render(scored.slice(0,6),!!terms.length)});
function render(items,hasFavorite){const section=document.getElementById('results'),cards=document.getElementById('cards');section.hidden=false;document.getElementById('count').textContent=`${items.length}冊`;document.getElementById('result-message').textContent=items.length?'条件に合う本を選びました。気になる本をチェックしてみてください。':hasFavorite?'入力した作家名・本に一致する登録本がありません。別の名前でお試しください。':'選んだ条件すべてに合う本がありません。条件を少し変えてお試しください。';cards.replaceChildren();if(!items.length){const empty=document.createElement('div');empty.className='empty';const emptyTitle=document.createElement('strong');emptyTitle.textContent='一致する本が見つかりませんでした';const emptyMessage=document.createTextNode('現在の登録本から条件に合うものがありません。作家名や本のタイトルを変えるか、条件をゆるめてみてください。');empty.append(emptyTitle,emptyMessage);cards.append(empty)}else items.forEach(({b,i})=>{const card=document.createElement('article');card.className='card';const cover=document.createElement('div');cover.className='cover '+(b.color||'c1');cover.textContent=b.title;const content=document.createElement('div');content.className='card-content';const genreEl=document.createElement('div');genreEl.className='genre';genreEl.textContent=b.genre||'おすすめ本';const title=document.createElement('h3');title.textContent=b.title;const author=document.createElement('div');author.className='author';author.textContent=b.author;const desc=document.createElement('p');desc.className='desc';desc.textContent=b.desc;const tags=document.createElement('div');tags.className='tags';[...b.moods.slice(0,2),...b.formats.slice(0,1)].forEach(t=>{const span=document.createElement('span');span.className='tag';span.textContent=t;tags.append(span)});const actions=document.createElement('div');actions.className='actions';const amazon=document.createElement('a');amazon.className='link-btn amazon';amazon.textContent='Amazonで探す ↗';amazon.href='https://www.amazon.co.jp/s?k='+encodeURIComponent(b.title);amazon.target='_blank';amazon.rel='noopener noreferrer';const calil=document.createElement('a');calil.className='link-btn';calil.textContent='図書館で探す ↗';calil.href='https://calil.jp/search?q='+encodeURIComponent(b.title);calil.target='_blank';calil.rel='noopener noreferrer';actions.append(amazon,calil);content.append(genreEl,title,author,desc,tags,actions);card.append(cover,content);cards.append(card)});section.scrollIntoView({behavior:'smooth',block:'start'})}
</script>
